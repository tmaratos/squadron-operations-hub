name: Deploy Backend

# Manual only. This deploys the original July backend (cloudflare/worker,
# Worker "tn170-squadron-ops-api"), whose route is
# tn170adminhub.tristanmaratos.com/api/* - the same paths the live Hub
# (apps/web) serves today. Both automatic runs failed in July because its
# lockfile pointed at a private package mirror, and that failure was the only
# thing stopping a push from putting this old API in front of the Hub's. With
# the lockfile fixed, an automatic deploy would have succeeded, so it no longer
# runs on push. Run it by hand only after its route has been moved or removed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: cloudflare/worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend
        run: npm run check

      - name: Generate production Wrangler configuration
        run: npm run prepare:config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.generated.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy --config wrangler.generated.jsonc
          secrets: |
            MAILGUN_API_KEY
            MAILGUN_DOMAIN
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
