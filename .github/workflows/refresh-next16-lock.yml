# One-shot branch-only lockfile refresh for the supported Next.js 16 upgrade.
# Intentionally cannot run on main, and never builds/deploys against production.
name: Refresh Next 16 lockfile
on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-next16-lock.yml
  push:
    branches:
      - fix/cloudflare-next16-supported-2026-10-22
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-next16-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Resolve and commit pnpm lockfile
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/cloudflare-next16-supported-2026-10-22')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-next16-supported-2026-10-22
          persist-credentials: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Regenerate deterministic pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Save lockfile on upgrade branch only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: resolve supported Next 16 dependencies"
          git push origin HEAD:fix/cloudflare-next16-supported-2026-10-22
